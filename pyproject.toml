[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-symbolic"
version = "1.13.3"
authors = [
  { name="Egor Kantserov", email="kantserovegor@gmail.com" },
]
description = "Differentiable Symbolic Regressor based on Exponent-Minus-Log (EML) architecture"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "scikit-learn>=1.0.0",
    "sympy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]