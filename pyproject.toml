[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-symbolic"
version = "1.13.4"
authors = [
  { name="Egor Kantserov", email="kantserovegor@gmail.com" },
]
license = "Apache-2.0"
description = "Differentiable Symbolic Regressor based on Exponent-Minus-Log (EML) architecture"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "scikit-learn>=1.0.0",
    "sympy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/Knixee/EML-Symbolic"
Repository = "https://github.com/Knixee/EML-Symbolic.git"
Issues = "https://github.com/Knixee/EML-Symbolic/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]
